

<!-- Ultimate Game Stash file--> 
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->


<!DOCTYPE html>
<html lang="en">

<head>
    <base href="https://cdn.jsdelivr.net/gh/genizy/soundboard@main/">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5521219086088837" crossorigin="anonymous"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundboard</title>
    <script src="sounds.js" type="module"></script>
    <script src="main.js" type="module"></script>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div id="controls">
        <button id="toggleFavorites" class="control-button favorites-toggle">⭐ Favorites: OFF</button>
        <button id="toggleButton" class="control-button overlap-toggle">🔇 Overlap: OFF</button>
        <button id="stopButton" class="control-button stop-button">⏹️ Stop All Sounds</button>
        <input id="searchInput" type="text" placeholder="Search sounds...">
    </div>
    <div id="soundboard"></div>

    <script>
        // Filter sounds with "hub" in the name
        function filterHubSounds() {
            const soundboard = document.getElementById('soundboard');
            if (!soundboard || soundboard.children.length === 0) {
                // Retry if soundboard not ready
                setTimeout(filterHubSounds, 500);
                return;
            }

            // Find all sound buttons and hide those with "hub" in the name
            const buttons = soundboard.querySelectorAll('button');
            let hidCount = 0;
            buttons.forEach(button => {
                const text = button.textContent.toLowerCase();
                const title = button.getAttribute('title')?.toLowerCase() || '';
                if (text.includes('hub') || title.includes('hub')) {
                    button.style.display = 'none';
                    hidCount++;
                }
            });

            // Also check parent containers
            const allElements = soundboard.querySelectorAll('*');
            allElements.forEach(el => {
                const text = el.textContent?.toLowerCase() || '';
                // Only hide if this element directly contains "hub" and is a container
                if (text.includes('hub') && (el.classList.length > 0 || el.tagName === 'BUTTON')) {
                    if (el.tagName === 'BUTTON' || el.parentElement?.tagName === 'BUTTON') {
                        el.closest('button')?.style.setProperty('display', 'none', 'important');
                    }
                }
            });
        }

        // Run filter after sounds load
        window.addEventListener('load', () => {
            setTimeout(filterHubSounds, 1000);
        });
        
        // Run periodically to catch dynamically added sounds
        setInterval(filterHubSounds, 2000);
        
        // Use MutationObserver to watch for new sounds being added
        const observer = new MutationObserver(() => {
            filterHubSounds();
        });

        setTimeout(() => {
            const soundboard = document.getElementById('soundboard');
            if (soundboard) {
                observer.observe(soundboard, {
                    childList: true,
                    subtree: true
                });
                filterHubSounds();
            }
        }, 1000);
    </script>
</body>

</html>
