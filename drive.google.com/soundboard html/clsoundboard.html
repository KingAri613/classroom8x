<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->


<!DOCTYPE html>
<html lang="en">

<head>
    <base href="https://cdn.jsdelivr.net/gh/genizy/soundboard@main/">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5521219086088837" crossorigin="anonymous"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-"></script>
    
    <meta charset="UTF-8">
    <title>Soundboard</title>
    <script src="sounds.js" type="module"></script>
    <script src="main.js" type="module"></script>
    <link href="style.css" rel="stylesheet">
    <script>
        // Filter out sounds with "hub" in the name
        window.filterSounds = function(sounds) {
            return sounds.filter(sound => !sound.name.toLowerCase().includes('hub'));
        };
    </script>
</head>

<body>
    <div id="controls">
        <button id="toggleFavorites" class="control-button favorites-toggle">⭐ Favorites: OFF</button>
        <button id="toggleButton" class="control-button overlap-toggle">🔇 Overlap: OFF</button>
        <button id="stopButton" class="control-button stop-button">⏹️ Stop All Sounds</button>
        <input id="searchInput" type="text" placeholder="Search sounds...">
    </div>
    <div id="soundboard"></div>
    <style>
        /* Hide sounds with "hub" in the name */
        button[data-name*="hub"], button[data-name*="Hub"], 
        button:has(:contains("hub")), button:has(:contains("Hub")) {
            display: none !important;
        }
    </style>
    <script>
        // Comprehensive hub sound filter
        function filterHubSounds() {
            const buttons = document.querySelectorAll('button');
            let filtered = 0;
            
            buttons.forEach(btn => {
                // Check multiple places for "hub"
                const text = btn.textContent.toLowerCase();
                const dataName = (btn.getAttribute('data-name') || '').toLowerCase();
                const title = (btn.getAttribute('title') || '').toLowerCase();
                const ariaLabel = (btn.getAttribute('aria-label') || '').toLowerCase();
                
                // Hide if contains hub in any form
                if (text.includes('hub') || dataName.includes('hub') || title.includes('hub') || ariaLabel.includes('hub')) {
                    btn.style.cssText = 'display: none !important; visibility: hidden !important; height: 0 !important; overflow: hidden !important;';
                    btn.disabled = true;
                    btn.style.pointerEvents = 'none';
                    btn.removeAttribute('onclick');
                    filtered++;
                }
            });
            
            return filtered;
        }
        
        // Run immediately
        filterHubSounds();
        
        // Run on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(filterHubSounds, 100);
                setTimeout(filterHubSounds, 500);
                setTimeout(filterHubSounds, 1000);
            });
        } else {
            setTimeout(filterHubSounds, 100);
            setTimeout(filterHubSounds, 500);
            setTimeout(filterHubSounds, 1000);
        }
        
        // Aggressive mutation observer
        const observer = new MutationObserver(() => {
            filterHubSounds();
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['style', 'class', 'data-name', 'title']
        });
    </script>
</body>

</html>
