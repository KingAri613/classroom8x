

<!-- Ultimate Game Stash file--> 
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->


<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Soundboard (Embedded)</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { background: #000; }
      .embed-frame { width: 100%; height: 100vh; border: 0; }
      .fallback { color: white; font-family: Arial, sans-serif; padding: 20px; }
    </style>
  </head>
  <body>
    <iframe
      class="embed-frame"
      src="https://soundboardquizizz.netlify.app/"
      title="External Soundboard"
      allow="autoplay; microphone; clipboard-read; clipboard-write"
      sandbox="allow-scripts allow-forms allow-same-origin allow-popups"
    ></iframe>
    <div class="fallback" hidden>
      If the embedded soundboard does not load, open it directly:
      <a href="https://soundboardquizizz.netlify.app/" target="_blank" rel="noopener">soundboardquizizz.netlify.app</a>
    </div>
                <!-- PANIC BUTTON REDIRECT -->
    <script>
        (function() {
            function getPanicRedirectUrl() {
                return localStorage.getItem('panicKeyRedirectUrl') || 'https://classroom.google.com';
            }

            function panicRedirect(event) {
                if (event.key === '-') {
                    window.location.replace(getPanicRedirectUrl());
                }
            }

            function addPanicListeners(targetWindow) {
                try {
                    if (!targetWindow || !targetWindow.addEventListener) return;
                    targetWindow.addEventListener('keydown', panicRedirect, true);
                    targetWindow.addEventListener('keypress', panicRedirect, true);
                } catch (err) {
                    // ignore cross-origin or unavailable iframe windows
                }
            }

            addPanicListeners(window);

            function attachPanicToIframe(iframe) {
                if (!iframe) return;
                iframe.addEventListener('load', function() {
                    addPanicListeners(iframe.contentWindow);
                });
                addPanicListeners(iframe.contentWindow);
            }

            if (typeof document !== 'undefined') {
                window.addEventListener('load', function() {
                    attachPanicToIframe(document.getElementById('gameFrame'));
                    attachPanicToIframe(document.getElementById('soundboardFrame'));
                    attachPanicToIframe(document.getElementById('youtubeFrame'));
                });
            }

            if (!localStorage.getItem('panicButtonNotificationShown')) {
                localStorage.setItem('panicButtonNotificationShown', 'true');

                var toast = document.createElement('div');
                toast.style.cssText = 'position: fixed; bottom: 18px; right: 18px; max-width: 360px; width: calc(100% - 32px); background: rgba(16, 18, 30, 0.94); color: #f4f4f4; border: 1px solid rgba(233, 69, 96, 0.85); border-radius: 14px; padding: 14px 16px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; font-size: 0.95rem; line-height: 1.5; box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35); z-index: 999999; backdrop-filter: blur(10px);';
                toast.innerHTML = '<div style="display:flex; gap:12px; align-items:flex-start;"><div style="flex:1;"><strong style="display:block; font-size:1rem; margin-bottom:6px; color:#fff;">Panic Key Tip</strong><span style="color:#ddd;">Press the <kbd style="display:inline-block; padding:5px 9px; border-radius:6px; background:#111; color:#fff; font-size:0.9rem;">-</kbd> key to redirect to your saved panic URL. Default: Google Classroom.</span></div><button type="button" style="border:none; background:#e94560; color:#fff; border-radius:10px; padding:8px 12px; cursor:pointer; font-weight:700;">Close</button></div>';
                var button = toast.querySelector('button');
                button.addEventListener('click', function() { toast.remove(); });
                document.body.appendChild(toast);
                setTimeout(function() { if (toast.parentNode) toast.remove(); }, 10000);
            }
        })();
    </script>

</body>

</html>
