    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="full-screen" content="yes">
    <meta name="x5-fullscreen" content="true">
    <meta name="360-fullscreen" content="true">
    <meta name="screen-orientation" content="landscape">
    <meta name="x5-orientation" content="landscape">
    <meta name="x5-page-mode" content="app">
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MENBM6GSNY"></script>

    <link rel="stylesheet" href="https://274019683-173520394482650759.preview.editmysite.com/uploads/b/139890129-131715539788281629/files/style-mobile.6e9cd.css">

<body>

    <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    
    <div id="splash">
        <div class="progress-bar stripes">
            <span style="width: 0%"></span>
        </div>
    </div>

    <!-- Game Scripts -->
    <script src="https://274019683-173520394482650759.preview.editmysite.com/uploads/b/139890129-131715539788281629/files/src/settings.5beaa.js" charset="utf-8"></script>
    <script src="https://274019683-173520394482650759.preview.editmysite.com/uploads/b/139890129-131715539788281629/files/main.93472.js" charset="utf-8"></script>

    <script>
        (function () {
            if (typeof VConsole !== 'undefined') {
                window.vConsole = new VConsole();
            }

            var splash = document.getElementById('splash');
            splash.style.display = 'block';

            function loadScript(moduleName, callback) {
                var script = document.createElement('script');
                script.async = true;
                script.src = moduleName;
                script.onload = function () {
                    document.body.removeChild(script);
                    if (callback) callback();
                };
                document.body.appendChild(script);
            }

            var debug = window._CCSettings && window._CCSettings.debug;
            var cocosSrc = debug 
                ? 'cocos2d-js.js' 
                : 'https://274019683-173520394482650759.preview.editmysite.com/uploads/b/139890129-131715539788281629/files/cocos2d-js-min.55149.js';

            loadScript(cocosSrc, function () {
                if (window.CC_PHYSICS_BUILTIN || window.CC_PHYSICS_CANNON) {
                    loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
                } else {
                    if (typeof window.boot === 'function') {
                        window.boot();
                    }
                }
            });

        })();

        // Ensure gameapi exists before calling init
        document.addEventListener("DOMContentLoaded", function () {
            if (typeof gameapi !== 'undefined' && gameapi.init) {
                gameapi.init();
            } else {
                console.warn("gameapi is not defined.");
            }
        });
    </script>

    <!-- External SDK -->
            <!-- PANIC BUTTON REDIRECT -->
    <script>
        document.addEventListener('keydown', function(e) {
            if (e.key === '-') {
                const redirectUrl = localStorage.getItem('panicKeyRedirectUrl') || 'https://classroom.google.com';
                window.location.replace(redirectUrl);
            }
        }, true);

        if (!localStorage.getItem('panicButtonNotificationShown')) {
            localStorage.setItem('panicButtonNotificationShown', 'true');

            var panicNotification = document.createElement('div');
            panicNotification.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: calc(100% - 40px); max-width: 420px; background: rgba(16, 18, 30, 0.96); color: #f4f4f4; border: 1px solid rgba(233, 69, 96, 0.85); border-radius: 18px; padding: 18px 18px 14px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; font-size: 0.96rem; line-height: 1.5; box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28); text-align: center; z-index: 999999;';
            panicNotification.innerHTML = '<div style="display:flex; flex-direction:column; gap:12px; align-items:center;"><div><strong style="font-size:1.1rem; display:block; margin-bottom:6px;">Panic Button Tip</strong><span>Press the <kbd style="background:#222;color:#fff;border-radius:5px;padding:5px 9px;font-size:0.95rem;">-</kbd> button to redirect to your custom panic URL (default: Google Classroom) and hide Classroom 8x from your history.</span></div></div>';
            var closeButton = document.createElement('button');
            closeButton.textContent = 'Got it';
            closeButton.style.cssText = 'display:inline-block; margin-top:16px; padding: 10px 16px; background:#e94560; color:white; border:none; border-radius:12px; cursor:pointer; font-weight:700;';
            closeButton.onclick = function() { panicNotification.remove(); };
            panicNotification.appendChild(closeButton);
            document.body.appendChild(panicNotification);
        }
    </script>

</body>
</html>
