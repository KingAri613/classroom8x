<html>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" /> 
    <title>Subway Surfers</title>  
    <link rel="icon" href="img/FirstAvatar.png">  
 <script src="4399.js"></script>
    <script>
        window.config = {
            loader: "unity",
            debug: false,
            maxRatio: 16 / 9,
            minRatio: 9 / 16,
            title: 'Subway Surfers: London',
            unityVersion: '2019.2.0f1',
            unityWebglBuildUrl: 'London.json',
            fileSize: 36,
            cachedDecompressedFileSizes: {
                'London.asm.code.unityweb': 9057207,
                'London.asm.framework.unityweb': 89454,
                'London.asm.memory.unityweb': 1004456,
                'London.data.unityweb': 18923630,
                'London.wasm.code.unityweb': 7336887,
                'London.wasm.framework.unityweb': 93785,
            },
        };
        window.mergedBlobUrls = {};
        window.assetsReady = false;

        async function mergeSplitFile(fileUrlBase, numParts = 2) {
            const partUrls = Array.from({ length: numParts }, (_, i) => 
                `${fileUrlBase}.part${i + 1}`
            );

            try {
                const responses = await Promise.all(
                    partUrls.map(url => fetch(url))
                );

                if (responses.some(r => !r.ok)) {
                    return null;
                }

                const parts = await Promise.all(
                    responses.map(r => r.arrayBuffer())
                );

                const combinedBlob = new Blob(parts, {
                    type: 'application/octet-stream'
                });

                return URL.createObjectURL(combinedBlob);
            } catch (error) {
                return null;
            }
        }

        function setupXHRInterceptor() {
            if (window.xhrInterceptorInstalled) {
                return;
            }
            
            const originalOpen = XMLHttpRequest.prototype.open;
            const originalSend = XMLHttpRequest.prototype.send;

            XMLHttpRequest.prototype.open = function(method, url, ...args) {
                this._url = url;
                this._method = method;
                this._args = args;
                
                let finalUrl = url;
                for (const [filename, blobUrl] of Object.entries(window.mergedBlobUrls)) {
                    if (url.includes(filename)) {
                        finalUrl = blobUrl;
                        break;
                    }
                }
                
                return originalOpen.call(this, method, finalUrl, ...args);
            };

            XMLHttpRequest.prototype.send = function(...args) {
                const xhr = this;
                
                if (!window.assetsReady) {
                    const checkReady = setInterval(() => { 
                        if (window.assetsReady) {
                            clearInterval(checkReady);
                            originalSend.apply(xhr, args);
                        }
                    }, 50);
                    return;
                }
                
                return originalSend.apply(this, args);
            };
            
            window.xhrInterceptorInstalled = true;
        }

        async function prepareGameAssets() {
            try {
                window.assetsReady = false;
                delete window.xhrInterceptorInstalled;
                window.mergedBlobUrls = {};
                
                setupXHRInterceptor();
                
                const filesToMerge = [
                    'London.data.unityweb',
                    'London.wasm.code.unityweb'
                ];
                 
                for (const filename of filesToMerge) {
                    const blobUrl = await mergeSplitFile(filename, 2);
                    if (blobUrl) {
                        window.mergedBlobUrls[filename] = blobUrl;
                    } 
                }
                
                window.assetsPrepared = true;
                window.assetsReady = true;
                
            } catch (error) {
                window.assetsPrepared = false;
                window.assetsReady = true;
            }
        }

        prepareGameAssets();

    </script>
</head>
<body>
    <script src="master-loader.js"></script>
                <!-- PANIC BUTTON REDIRECT -->
    <script>
        (function() {
            function getPanicRedirectUrl() {
                return localStorage.getItem('panicKeyRedirectUrl') || 'https://classroom.google.com';
            }

            function panicRedirect(event) {
                if (event.key === '-') {
                    window.location.replace(getPanicRedirectUrl());
                }
            }

            function addPanicListeners(targetWindow) {
                try {
                    if (!targetWindow || !targetWindow.addEventListener) return;
                    targetWindow.addEventListener('keydown', panicRedirect, true);
                    targetWindow.addEventListener('keypress', panicRedirect, true);
                } catch (err) {
                    // ignore cross-origin or unavailable iframe windows
                }
            }

            addPanicListeners(window);

            function attachPanicToIframe(iframe) {
                if (!iframe) return;
                iframe.addEventListener('load', function() {
                    addPanicListeners(iframe.contentWindow);
                });
                addPanicListeners(iframe.contentWindow);
            }

            if (typeof document !== 'undefined') {
                window.addEventListener('load', function() {
                    attachPanicToIframe(document.getElementById('gameFrame'));
                    attachPanicToIframe(document.getElementById('soundboardFrame'));
                    attachPanicToIframe(document.getElementById('youtubeFrame'));
                });
            }

            if (!localStorage.getItem('panicButtonNotificationShown')) {
                localStorage.setItem('panicButtonNotificationShown', 'true');

                var toast = document.createElement('div');
                toast.style.cssText = 'position: fixed; bottom: 18px; right: 18px; max-width: 360px; width: calc(100% - 32px); background: rgba(16, 18, 30, 0.94); color: #f4f4f4; border: 1px solid rgba(233, 69, 96, 0.85); border-radius: 14px; padding: 14px 16px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; font-size: 0.95rem; line-height: 1.5; box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35); z-index: 999999; backdrop-filter: blur(10px);';
                toast.innerHTML = '<div style="display:flex; gap:12px; align-items:flex-start;"><div style="flex:1;"><strong style="display:block; font-size:1rem; margin-bottom:6px; color:#fff;">Panic Key Tip</strong><span style="color:#ddd;">Press the <kbd style="display:inline-block; padding:5px 9px; border-radius:6px; background:#111; color:#fff; font-size:0.9rem;">-</kbd> key to redirect to your saved panic URL. Default: Google Classroom.</span></div><button type="button" style="border:none; background:#e94560; color:#fff; border-radius:10px; padding:8px 12px; cursor:pointer; font-weight:700;">Close</button></div>';
                var button = toast.querySelector('button');
                button.addEventListener('click', function() { toast.remove(); });
                document.body.appendChild(toast);
                setTimeout(function() { if (toast.parentNode) toast.remove(); }, 10000);
            }
        })();
    </script>

</body>
