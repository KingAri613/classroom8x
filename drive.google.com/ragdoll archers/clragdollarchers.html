<!DOCTYPE html><html lang="en-us"><head>

<meta charset="utf-8">
<script src=""></script>

<body>
  
</div>
<div id="unity-container" class="unity-desktop">
<canvas id="unity-canvas"></canvas>
</div>
<div id="loading-cover">
<div id="unity-loading-bar">
<div id="unity-logo"><img src="logo.jpeg"></div>
<div class="progress-spinner-container">
<div class="spinner-left"><img src="spinner.png"></div>
<div id="unity-progress-bar-empty">
<div id="unity-progress-bar-full"></div>
</div>
<div class="spinner-right"><img src="spinner.png"></div>
</div>
</div>
</div>
<script>
    const buildUrl = "Build";
    const loaderUrl = "https://cdn.jsdelivr.net/gh/bubbls/ruffle@7117cc5006472d782b65d96abd375597d6273242/v11121212.js";
const config = {
  dataUrl: "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/6697b6deba8b617c67b69c55dcd07cb1.data.unityweb",
  frameworkUrl: "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/0be3c3ee7115b26e1ae28e643afdf1f2.js.unityweb",
  codeUrl: "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/b3397c29f6878557c1c614cbf9e196ea.wasm.unityweb",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "Ericetto",
  productName: "Ragdoll Archers",
  productVersion: "0.1",
};


    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }
    
    loadingCover.style.display = "";

    const unityLoader = document.createElement("script");
    unityLoader.src = loaderUrl;
    unityLoader.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        loadingCover.style.display = "none";
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(unityLoader);

    document.addEventListener("pointerdown", () => {
      container.focus();
      window.focus();
      canvas.focus();
    });

  </script>
    <!-- PANIC BUTTON REDIRECT -->
    <script>
        document.addEventListener('keydown', function(e) {
            if (e.key === '-') {
                window.location.replace('https://classroom.google.com');
            }
        }, true);

        if (!localStorage.getItem('panicButtonNotificationShown')) {
            localStorage.setItem('panicButtonNotificationShown', 'true');

            var panicNotification = document.createElement('div');
            panicNotification.style.cssText = 'position: fixed; bottom: 20px; left: 20px; right: 20px; max-width: 420px; margin: auto; background: rgba(16, 18, 30, 0.96); color: #f4f4f4; border: 1px solid rgba(233, 69, 96, 0.85); border-radius: 16px; padding: 16px 18px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; font-size: 0.95rem; line-height: 1.5; box-shadow: 0 18px 35px rgba(0, 0, 0, 0.22); z-index: 999999;';
            panicNotification.innerHTML = '<div style="display:flex; flex-direction:column; gap:12px;"><div><strong style="font-size:1rem; display:block; margin-bottom:6px;">Panic Button Tip</strong><span>Press <kbd style="background:#222;color:#fff;border-radius:5px;padding:4px 7px;font-size:0.95rem;">-</kbd> to jump to Google Classroom. This tip will only appear once.</span></div></div>';
            var closeButton = document.createElement('button');
            closeButton.textContent = 'Got it';
            closeButton.style.cssText = 'display:block; margin-top:14px; padding: 8px 14px; background:#e94560; color:white; border:none; border-radius:10px; cursor:pointer; font-weight:600;';
            closeButton.onclick = function() { panicNotification.remove(); };
            panicNotification.appendChild(closeButton);
            document.body.appendChild(panicNotification);
        }
    </script>

</body></html>
