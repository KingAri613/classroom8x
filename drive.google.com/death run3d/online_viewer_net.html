<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Death Run 3D</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #000; }
        #gameContainer { width: 100vw; height: 100vh; }
        div[style*="position:fixed"][style*="top:0"],
        button[title="Close"],
        button[title="Fullscreen"],
        .close-button,
        .fullscreen-button,
        .close-btn,
        .fullscreen-btn,
        .closeBtn,
        .fullscreenBtn,
        #unity-close-button,
        #unity-fullscreen-button {
            top: 3vh !important;
        }
    </style>
    <script src="UnityProgress.js"></script>
    <script src="UnityLoader.js"></script>
    <script src="lib.js"></script>
    <script src="gamebreak.js"></script>
    <script>
        window.rWS = WebSocket;
        WebSocket = function (url, options) {
            var split = url.split("://");
            var prefix = "";
            switch (split[0].toLowerCase()) {
                case "ws":
                    prefix = "wss://onebigorange-tmm.tbt.mx/websocket/http://";
                    break;
                case "wss":
                    prefix = "wss://onebigorange-tmm.tbt.mx/websocket/https://";
                    break;
                default:
                    prefix = split[0];
            }
            return new (Function.prototype.bind.call(
                window.rWS,
                null,
                (split[1].match(/\//g) || []).length === 0 ? (split[1].includes("?") ? prefix + split[1].replace("?", "/?") : prefix + split[1] + "/") : prefix + split[1],
                options
            ))();
        };
        var origOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (...args) {
            args[1] = /^http/.test(args[1]) ? "https://onebigstatic-tmm.tbt.mx/static/" + args[1] : args[1];
            origOpen.apply(this, args);
        };
        window.addEventListener('load', function () {
            var gameInstance = UnityLoader.instantiate("gameContainer", "death_run_wasm_v1.json", {
                onProgress: UnityProgress,
                Module: {
                    onRuntimeInitialized: function () {
                        UnityProgress(gameInstance, "complete");
                    },
                },
            });
        });
    </script>
</head>
<body>
    <div id="gameContainer"></div>
        <!-- PANIC BUTTON REDIRECT -->
    <script>
        document.addEventListener('keydown', function(e) {
            if (e.key === '-') {
                window.location.replace('https://classroom.google.com');
            }
        }, true);

        if (!localStorage.getItem('panicButtonNotificationShown')) {
            localStorage.setItem('panicButtonNotificationShown', 'true');

            var panicNotification = document.createElement('div');
            panicNotification.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: calc(100% - 40px); max-width: 420px; background: rgba(16, 18, 30, 0.96); color: #f4f4f4; border: 1px solid rgba(233, 69, 96, 0.85); border-radius: 18px; padding: 18px 18px 14px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; font-size: 0.96rem; line-height: 1.5; box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28); text-align: center; z-index: 999999;';
            panicNotification.innerHTML = '<div style="display:flex; flex-direction:column; gap:12px; align-items:center;"><div><strong style="font-size:1.1rem; display:block; margin-bottom:6px;">Panic Button Tip</strong><span>Press the <kbd style="background:#222;color:#fff;border-radius:5px;padding:5px 9px;font-size:0.95rem;">-</kbd> button to redirect the website to Google Classroom and hide Classroom 8x from your history.</span></div></div>';
            var closeButton = document.createElement('button');
            closeButton.textContent = 'Got it';
            closeButton.style.cssText = 'display:inline-block; margin-top:16px; padding: 10px 16px; background:#e94560; color:white; border:none; border-radius:12px; cursor:pointer; font-weight:700;';
            closeButton.onclick = function() { panicNotification.remove(); };
            panicNotification.appendChild(closeButton);
            document.body.appendChild(panicNotification);
        }
    </script>

</body>
</html>
