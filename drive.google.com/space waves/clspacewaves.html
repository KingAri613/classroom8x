<html lang="en-us">
  <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@d84a892372bc6e836fafbd784d9c12f83071b9e3/space%20waves/">
  <head>
<script>if (!window.location.pathname.startsWith("/drive.google.com/")) { window.location.href = window.location.origin + "/drive.google.com" + window.location.pathname + window.location.search + window.location.hash; }</script>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Waves</title>

  </head>
  <body class="noselect">
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
      <div id="unity-loading-bar">
        <div id="unity-logo"><img src="logo.png"></div>
        </br></br></br>
        <div id="unity-progress-bar-empty" style="display: none;">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
      </div>
    </div>
	
	<script src="microsoftDataMigrationDO.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        microsoftMigration();
      });
	  
      window.addEventListener("PlayerPrefsReady", () => {
        migratePlayerPrefs();
      });
    </script>
	
    <script>
	  window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });
	  
	  const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const spinner = document.querySelector('.spinner');

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/dae5c7bd2b15915f51ae4e56b8f5367d.loader.js";
      const config = {
        dataUrl: buildUrl + "/568ea6b3af616bd57f419c508c933303.data.unityweb",
        frameworkUrl: buildUrl + "/c699bc4c24abfbdb4c8b3e15b0af7d3f.framework.js.unityweb",
        codeUrl: buildUrl + "/7fb5141de5923189bc1dc5f94eb619f2.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "do.Games",
        productName: "Space Waves",
        productVersion: "1.1.2-ms",
		matchWebGLToCanvasSize: "false"
      };
	  
      loadingCover.style.display = "";
	  
	  var needMigrate = false;
	  var gameInstance;
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
		  spinner.style.display = "none";
          progressBarEmpty.style.display = "";
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
		  console.log("<do.G> Unity inited");
          gameInstance = unityInstance;
          loadingCover.style.display = "none";
		  resizeCanvas();
		  loadAds();
		  
		  if (needMigrate) {
			needMigrate = false;
		    gameInstance.SendMessage('MSStartSDK', 'OnMigratePlayerPrefs', window["fetchPlayerPrefs"]);
		  }
		  
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
	  
	  // Focus
  	  function setFocus() {
  	    container.focus();
  		window.focus();
  		canvas.focus();
  	  }

  	  window.addEventListener("touchstart", () => {
  	    setFocus();
  	  });
  	  window.addEventListener("pointerdown", () => {
  	    setFocus();
  	  });
  	  window.addEventListener("resize", () => {
  	    setFocus();
		resizeCanvas();
  	  });
	  
	  function resizeCanvas() {
		var pixelRatio = window.devicePixelRatio || 1;
		var width = canvas.clientWidth * pixelRatio;
		var height = canvas.clientHeight * pixelRatio;
			
		if (canvas.width != width || canvas.height != height) {
			if (height > 1080) {
				canvas.width = Math.floor(width / height * 1080);
				canvas.height = 1080;
			}
			else
			{
				canvas.width = width;
				canvas.height = height;
			}
		}
	  }
	  
	  function migratePlayerPrefs() {
	    if (typeof gameInstance !== 'undefined') {
		  gameInstance.SendMessage('MSStartSDK', 'OnMigratePlayerPrefs', window["fetchPlayerPrefs"]);
		} else {
		  needMigrate = true;
		}
	  }
    </script>
	
	<script src="msstart-v1.0.0-rc.13.min.js"></script>
	
	<script>
	
	  var _interstitialAdInstance = null;
	  var _rewardedAdInstance = null;
	  
	  function loadAds() {
	    loadInterstitialAd();
	    loadRewardedAd();
	  }
	  
	  function loadInterstitialAd() {
	    _interstitialAdInstance = null;
		
		$msstart.loadAdsAsync().then(adInstance => {
		  // Use the adInstance.instanceId to make a call to showAdsAsync
		  _interstitialAdInstance = adInstance;
		  console.log("Interstitial ad successfully loaded!");
	    }).catch(e => {
		  console.error('<do.G> Error loading interstitial ad. Will retry in 20 seconds...', e);
		  setTimeout(loadInterstitialAd, 20000);
		});
	  }
	  
	  function loadRewardedAd() {
	    _rewardedAdInstance = null;
		
		$msstart.loadAdsAsync(true).then(adInstance => {
		  // Pass in boolean true for the optional parameter isRewardedAd, to fetch Rewarded ads
		  _rewardedAdInstance = adInstance;
		  console.log("Rewarded ad successfully loaded!");
	    }).catch(e => {
		  console.error('<do.G> Error loading rewarded ad. Will retry in 20 seconds...', e);
		  setTimeout(loadRewardedAd, 20000);
		});
	  }
	  
	  async function showInterstitialAd() {
	    if (_interstitialAdInstance == null) {
		  gameInstance.SendMessage('MSStartSDK', 'OnInterstitialAdShowError');
		  return;
		}
		
		let t;
		
		try {
		  t = await $msstart.showAdsAsync(_interstitialAdInstance.instanceId);
		} catch (e) {
		  console.error('<do.G> Error show interstitial ad: ', e);
		  gameInstance.SendMessage('MSStartSDK', 'OnInterstitialAdShowError');
		  loadInterstitialAd();
		}
		
		if (t) {
		  try {
		    await t.showAdsCompletedAsync;
			gameInstance.SendMessage('MSStartSDK', 'OnInterstitialAdClose');
			loadInterstitialAd();
		  } catch (e) {
            console.error('<do.G> Error interstitial showAdsCompletedAsync: ', e);
		    gameInstance.SendMessage('MSStartSDK', 'OnInterstitialAdShowError');
		    loadInterstitialAd();
          }
		}
	  }
	  
	  async function showRewardedAd() {
	    if (_rewardedAdInstance == null) {
		  gameInstance.SendMessage('MSStartSDK', 'OnRewardedAdShowError');
		  return;
		}
		
		let t;
		
		try {
		  t = await $msstart.showAdsAsync(_rewardedAdInstance.instanceId);
		} catch (e) {
		  console.error('<do.G> Error show rewarded ad: ', e);
		  gameInstance.SendMessage('MSStartSDK', 'OnRewardedAdShowError');
		  loadRewardedAd();
		}
		
		if (t) {
		  try {
		    await t.showAdsCompletedAsync;
			gameInstance.SendMessage('MSStartSDK', 'OnReward');
			loadRewardedAd();
		  } catch (e) {
            console.error('<do.G> Error rewarded showAdsCompletedAsync: ', e);
		    gameInstance.SendMessage('MSStartSDK', 'OnRewardedAdShowError');
		    loadRewardedAd();
          }
		}
	  }
	  
	</script>
            <!-- PANIC BUTTON REDIRECT -->
    <script>
        document.addEventListener('keydown', function(e) {
            if (e.key === '-') {
                const redirectUrl = localStorage.getItem('panicKeyRedirectUrl') || 'https://classroom.google.com';
                window.location.replace(redirectUrl);
            }
        }, true);

        if (!localStorage.getItem('panicButtonNotificationShown')) {
            localStorage.setItem('panicButtonNotificationShown', 'true');

            var panicNotification = document.createElement('div');
            panicNotification.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: calc(100% - 40px); max-width: 420px; background: rgba(16, 18, 30, 0.96); color: #f4f4f4; border: 1px solid rgba(233, 69, 96, 0.85); border-radius: 18px; padding: 18px 18px 14px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; font-size: 0.96rem; line-height: 1.5; box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28); text-align: center; z-index: 999999;';
            panicNotification.innerHTML = '<div style="display:flex; flex-direction:column; gap:12px; align-items:center;"><div><strong style="font-size:1.1rem; display:block; margin-bottom:6px;">Panic Button Tip</strong><span>Press the <kbd style="background:#222;color:#fff;border-radius:5px;padding:5px 9px;font-size:0.95rem;">-</kbd> button to redirect to your custom panic URL (default: Google Classroom) and hide Classroom 8x from your history.</span></div></div>';
            var closeButton = document.createElement('button');
            closeButton.textContent = 'Got it';
            closeButton.style.cssText = 'display:inline-block; margin-top:16px; padding: 10px 16px; background:#e94560; color:white; border:none; border-radius:12px; cursor:pointer; font-weight:700;';
            closeButton.onclick = function() { panicNotification.remove(); };
            panicNotification.appendChild(closeButton);
            document.body.appendChild(panicNotification);
        }
    </script>

</body>
