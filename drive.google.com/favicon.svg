<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Yellow outer rounded rectangle -->
  <rect x="10" y="10" width="180" height="180" rx="30" ry="30" fill="#FFD93D" />
  
  <!-- Green chalkboard -->
  <rect x="30" y="35" width="140" height="110" rx="8" ry="8" fill="#2DBE8D" />
  
  <!-- Chalkboard frame/border -->
  <rect x="30" y="35" width="140" height="110" rx="8" ry="8" fill="none" stroke="#1a8f6b" stroke-width="2" />
  
  <!-- White chalk/eraser at bottom -->
  <rect x="75" y="135" width="50" height="12" rx="4" ry="4" fill="#FFFFFF" />
  
  <!-- Chalk lines for effect -->
  <line x1="40" y1="55" x2="160" y2="55" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3" />
  <line x1="40" y1="70" x2="160" y2="70" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3" />
  <line x1="40" y1="85" x2="160" y2="85" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3" />
  <line x1="40" y1="100" x2="160" y2="100" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3" />
  <line x1="40" y1="115" x2="160" y2="115" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3" />
</svg>
