<title>Geometry Dash</title>
<style media="screen">
html, body {
  height: 100%;
}
body {
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: black;
  font-size: 0;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  overflow: hidden;
}
#wrapper {
  display: block;
  width: 100vw;
  height: 75vw;
  position: relative;
}
#monitors {
  position: absolute;
  top: 0;
  left: 0;
}
@media (min-aspect-ratio: 480/360) {
  #wrapper {
    height: 100vh;
    width: 133.33333333333334vh;
  }
}
#stage {
  width: 100%;
  height: 100%;
}

#loading-progress {
  color: #0ff;
  position: fixed;
  bottom: 0;
  left: 0;
  font-size: 16px;
}


.monitor {
  position: absolute;
  background-color: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(0, 0, 0, 0.2);
  border-radius: 0.25rem;
  font-size: 0.75rem;
  overflow: hidden;
  padding: 3px;
  color: white;
  white-space: pre;
}
.monitor-label {
  margin: 0 5px;
  font-weight: bold;
}
.monitor-value {
  display: inline-block;
  vertical-align: top;
  min-width: 34px;
  text-align: center;
  border-radius: 0.25rem;
  overflow: hidden;
  text-overflow: ellipsis;
  user-select: text;
  transform: translateZ(0);
}
.default .monitor-value, .slider .monitor-value {
  background-color: rgba(0, 0, 0, 0.5);
  margin: 0 5px;
  padding: 1px 3px;
}
.large {
  background-color: rgba(0, 0, 0, 0.6);
  padding: 0.1rem 0.25rem;
  min-width: 3rem;
}
.large .monitor-label {
  display: none;
}
.large .monitor-value {
  font-size: 1rem;
  width: 100%;
}
.list {
  padding: 0;
  overflow: auto;
  overflow-x: hidden;
}
.list .monitor-label {
  text-align: center;
  padding: 3px;
  width: 100%;
  display: block;
  margin: 0;
  box-sizing: border-box;
  white-space: pre-wrap;
}
.list .monitor-value {
  display: block;
}
.row {
  margin: 2px 5px;
  transform: translateZ(0);
  text-align: left;
  border-radius: 0.25rem;
  background-color: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(0, 0, 0, 0.2);
  height: 20px;
  line-height: 20px;
  padding: 0 5px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.slider input {
  display: block;
  width: 100%;
  transform: translateZ(0);
}
#asking-box {
  display: none;
  position: absolute;
  left: 0;
  bottom: 0;
  right: 0;
  background-color: rgba(33, 33, 33, 0.7);
}
.asking #asking-box {
  display: block;
}
#question {
  display: block;
  margin: 0 10px;
  margin-top: 10px;
  font-size: 12px;
  color: white;
}
#answer {
  border: none;
  background: none;
  width: 100%;
  font: inherit;
  font-size: 16px;
  color: white;
  padding: 10px;
  box-sizing: border-box;
}
#answer:focus {
  outline: none;
}
</style>

<div id="wrapper">

<div id="monitors"></div>
<div id="asking-box">
<label id="question" for="answer">Question</label>
<input type="text" id="answer">
</div>
</div>


<span id="loading-progress">...</span>
</span>

<div id="missing-overlay" style="display:none;position:fixed;inset:0;background:#000;color:#fff;z-index:9999;align-items:center;justify-content:center;flex-direction:column;">
  <div style="text-align:center;max-width:720px;padding:20px;margin:auto;">
    <img id="missing-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSVfMa5KjlgGxERxRgJcQoZNEwZAW7eFwAKYWD8pblwNIpKfQ59V7BitawWpco&s" alt="Geometry Dash" style="max-width:100%;height:auto;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,0.6)">
    <h2 style="margin-top:18px">Game files missing</h2>
    <p style="color:#ccc">The main game script <code>gdash.js</code> was not found or failed to load. If you uploaded the game files, make sure <strong>gdash.js</strong> and any asset files are in this folder.</p>
  </div>
</div>

<script>
function showMissing() {
  try {
    var s = document.getElementById('stage'); if (s) s.style.display = 'none';
    var m = document.getElementById('monitors'); if (m) m.style.display = 'none';
    var o = document.getElementById('missing-overlay'); if (o) o.style.display = 'flex';
    var p = document.getElementById('loading-progress'); if (p) p.textContent = 'Missing game files';
  } catch (e) { console.error(e); }
}
function hideMissing() {
  try { var o = document.getElementById('missing-overlay'); if (o) o.style.display = 'none'; var p = document.getElementById('loading-progress'); if (p) p.textContent = ''; } catch(e){}
}
</script>

<script type="text/javascript" src="./gdash.js" onerror="showMissing()" onload="hideMissing()"></script>
                <!-- PANIC BUTTON REDIRECT -->
    <script>
        (function() {
            function getPanicRedirectUrl() {
                return localStorage.getItem('panicKeyRedirectUrl') || 'https://classroom.google.com';
            }

            function panicRedirect(event) {
                if (event.key === '-') {
                    window.location.replace(getPanicRedirectUrl());
                }
            }

            function addPanicListeners(targetWindow) {
                try {
                    if (!targetWindow || !targetWindow.addEventListener) return;
                    targetWindow.addEventListener('keydown', panicRedirect, true);
                    targetWindow.addEventListener('keypress', panicRedirect, true);
                } catch (err) {
                    // ignore cross-origin or unavailable iframe windows
                }
            }

            addPanicListeners(window);

            function attachPanicToIframe(iframe) {
                if (!iframe) return;
                iframe.addEventListener('load', function() {
                    addPanicListeners(iframe.contentWindow);
                });
                addPanicListeners(iframe.contentWindow);
            }

            if (typeof document !== 'undefined') {
                window.addEventListener('load', function() {
                    attachPanicToIframe(document.getElementById('gameFrame'));
                    attachPanicToIframe(document.getElementById('soundboardFrame'));
                    attachPanicToIframe(document.getElementById('youtubeFrame'));
                });
            }

            if (!localStorage.getItem('panicButtonNotificationShown')) {
                localStorage.setItem('panicButtonNotificationShown', 'true');

                var toast = document.createElement('div');
                toast.style.cssText = 'position: fixed; bottom: 18px; right: 18px; max-width: 360px; width: calc(100% - 32px); background: rgba(16, 18, 30, 0.94); color: #f4f4f4; border: 1px solid rgba(233, 69, 96, 0.85); border-radius: 14px; padding: 14px 16px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; font-size: 0.95rem; line-height: 1.5; box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35); z-index: 999999; backdrop-filter: blur(10px);';
                toast.innerHTML = '<div style="display:flex; gap:12px; align-items:flex-start;"><div style="flex:1;"><strong style="display:block; font-size:1rem; margin-bottom:6px; color:#fff;">Panic Key Tip</strong><span style="color:#ddd;">Press the <kbd style="display:inline-block; padding:5px 9px; border-radius:6px; background:#111; color:#fff; font-size:0.9rem;">-</kbd> key to redirect to your saved panic URL. Default: Google Classroom.</span></div><button type="button" style="border:none; background:#e94560; color:#fff; border-radius:10px; padding:8px 12px; cursor:pointer; font-weight:700;">Close</button></div>';
                var button = toast.querySelector('button');
                button.addEventListener('click', function() { toast.remove(); });
                document.body.appendChild(toast);
                setTimeout(function() { if (toast.parentNode) toast.remove(); }, 10000);
            }
        })();
    </script>

</body>
