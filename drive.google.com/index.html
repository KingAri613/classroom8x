        // Play an audio file by URL (for files placed in /soundboard)
        function playAudioFile(src, button) {
            try {
                // Check if this sound is already playing
                if (audioMap.has(src)) {
                    const existing = audioMap.get(src);
                    existing.audio.pause();
                    existing.audio.currentTime = 0;
                    activeAudioElements = activeAudioElements.filter(x => x !== existing.audio);
                    audioMap.delete(src);
                    if (existing.button) {
                        existing.button.style.boxShadow = 'none';
                    }
                    return;
                }

                // Stop all other sounds and reset their buttons
                audioMap.forEach((value, key) => {
                    value.audio.pause();
                    value.audio.currentTime = 0;
                    if (value.button) {
                        value.button.style.boxShadow = 'none';
                    }
                });
                audioMap.clear();
                activeAudioElements = [];

                // Play new sound
                const a = new Audio(src);
                a.preload = 'auto';
                a.play();
                activeAudioElements.push(a);
                audioMap.set(src, { audio: a, button: button });
                
                a.addEventListener('ended', () => {
                    activeAudioElements = activeAudioElements.filter(x => x !== a);
                    audioMap.delete(src);
                    if (button) {
                        button.style.boxShadow = 'none';
                    }
                });
            } catch (e) {
                console.error('Audio play error', e);
            }
        }

        function stopAllAudio() {
            try {
                // stop HTMLAudioElements
                activeAudioElements.forEach(a => {
                    try { a.pause(); a.currentTime = 0; } catch (e) {}
                });
                activeAudioElements = [];
            } catch (e) {

        function formatSoundName(path) {
            return path
                .split('/')
                .pop()
                .replace(/\.mp3$/i, '')
                .replace(/[-_]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        async function isAudioFile(path) {
            try {
                const response = await fetch(path, {
                    method: 'GET',
                    headers: { Range: 'bytes=0-512' }
                });

                if (!response.ok) return false;

                const contentType = (response.headers.get('content-type') || '').toLowerCase();
                if (contentType.includes('audio/')) return true;

                const snippet = (await response.text()).trim().slice(0, 120).toLowerCase();
                const looksLikeHtml = snippet.startsWith('<!doctype') || snippet.startsWith('<html') || snippet.includes('<head');
                if (looksLikeHtml) return false;

                return /\.(mp3|wav|ogg|m4a|aac|flac)$/i.test(path);
            } catch (e) {
                return false;
            }
        }

        function renderSoundboard(filteredFiles) {

                imageButton.type = 'button';

                const image = document.createElement('img');
                image.src = soundButtonImage;
                image.alt = `Play ${formatSoundName(path)}`;
                image.style.width = '100%';
                image.style.height = '100%';
                image.style.objectFit = 'cover';

                const label = document.createElement('div');

                label.style.color = '#eaeaea';
                label.style.fontSize = '0.9em';
                label.style.textAlign = 'center';

                    if (!isPlaying) {
                        imageButton.style.boxShadow = '0 0 0 3px rgba(233,69,96,0.45)';
                    }
                    playAudioFile(path, imageButton);
                };
                imageButton.dataset.soundBtn = 'true';
                imageButton.dataset.soundPath = path;

                wrapper.appendChild(imageButton);
                wrapper.appendChild(label);
                grid.appendChild(wrapper);
            });
        }

        function filterSoundboard() {
            const query = currentSoundSearch.trim().toLowerCase();
            if (!query) {
                renderSoundboard(validSoundFiles);
                return;
            }
            const filtered = validSoundFiles.filter(path => formatSoundName(path).toLowerCase().includes(query));
            renderSoundboard(filtered);
        }

        async function buildSoundboard() {
            const checks = soundFiles.map(async (path) => {
                if (await isAudioFile(path)) return path;
                return null;
            });
            const results = await Promise.all(checks);
            validSoundFiles = results.filter(Boolean);
            filterSoundboard();
        }

            if (!soundSearchInput) return;

        async function loadGames() {
            try {
                const response = await fetch('games.json');
                allGames = await response.json();
                renderGames(allGames);
            } catch (error) {
                console.error('Error loading games:', error);
                document.getElementById('gamesGrid').innerHTML = `
                    <div class="empty-state">
                        <h2>Error loading games</h2>
                        <p>Please check the console for more details.</p>
                    </div>
                `;
            }
        }

        function filterGames() {
            filteredGames = allGames.filter(game => {
                const matchesCategory = currentCategory === 'all' || 
                    (game.categories && game.categories.includes(currentCategory));
                const matchesSearch = currentSearch === '' ||
                    game.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
                    game.description.toLowerCase().includes(currentSearch.toLowerCase());
                return matchesCategory && matchesSearch;
            });
            renderGames(filteredGames);
        }

        function renderGames(games) {
            const grid = document.getElementById('gamesGrid');
            
            if (games.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h2>No games found</h2>
                        <p>Try adjusting your filters or search.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = games.map(game => `
                <div class="game-card" onclick="playGame('${game.gameUrl}', '${game.name}')">
                    <div class="game-thumbnail">
                        ${game.image ? `<img src="${game.image}" alt="${game.name}" onerror="this.style.display='none';this.nextElementSibling?.style.display='flex'">` : ''}
                        <div style="font-size: 4em; display: ${game.image ? 'none' : 'flex'}; align-items: center; justify-content: center; width: 100%; height: 100%;">${game.icon}</div>
                    </div>
                    <div class="game-info">
                        <div class="game-title">${game.name}</div>
                        <button class="game-button" onclick="event.stopPropagation(); playGame('${game.gameUrl}', '${game.name}')">Play Now</button>
                    </div>
                </div>
            `).join('');
        }

        function playGame(gameUrl, gameName) {
            document.getElementById('gameFrame').src = '';
            document.getElementById('gameModal').classList.add('active');
            document.body.classList.add('game-open');
            
            // Small delay to ensure modal is active before loading game
            setTimeout(() => {
                document.getElementById('gameFrame').src = gameUrl;
            }, 50);
        }

        async function toggleGameFullscreen() {
            const frame = document.getElementById('gameFrame');
            if (!frame) return;

            try {
                if (!document.fullscreenElement) {
                    if (frame.requestFullscreen) {
                        await frame.requestFullscreen();
                    } else if (frame.webkitRequestFullscreen) {
                        frame.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                }
            } catch (error) {
                console.error('Fullscreen error:', error);
            }
        }

        function closeGame() {
            document.getElementById('gameModal').classList.remove('active');
            document.getElementById('gameFrame').src = '';
            document.body.classList.remove('game-open');
            document.body.style.overflow = '';
        }

            currentSearch = e.target.value;
            filterGames();
        });

                filterGames();
            });
        });

                    z-index: 3000;
                    max-width: 350px;
                    animation: slideInRight 0.4s ease-out;
                    font-size: 0.95em;
                    line-height: 1.4;
                `;
                notification.innerHTML = `

                `;
                document.body.appendChild(notification);
                setTimeout(() => {

                }, 8000);
            }
        }

        document.head.appendChild(style);

        window.addEventListener('load', showClassroomNotification);

        // Generate and inject JSON-LD schema for games (SEO)
        fetch('games.json')
            .then(res => res.json())
            .then(games => {
                const gameSchemas = games.slice(0, 10).map(game => ({
                    "@type": "Thing",
                    "name": game.name,
                    "description": game.description,
                    "image": game.image,
                    "url": `https://classroom8x.netlify.app/?game=${game.id}`
                }));

                const collectionSchema = {
                    "@context": "https://schema.org",
                    "@type": "Collection",
                    "name": "classroom 8x - Game Collection",
                    "description": "Collection of unblocked games for classroom entertainment",
                    "hasPart": gameSchemas
                };

                const script = document.createElement('script');
                script.type = 'application/ld+json';
                script.textContent = JSON.stringify(collectionSchema);
                document.head.appendChild(script);
            })
            .catch(err => console.log('SEO: Could not load game schema', err));
