<!DOCTYPE html>
<script>if (!window.location.pathname.startsWith("/drive.google.com/")) { window.location.href = window.location.origin + "/drive.google.com" + window.location.pathname + window.location.search + window.location.hash; }</script>
<html lang="en">
<head>
<script>if (!window.location.pathname.startsWith("/drive.google.com/")) { window.location.href = window.location.origin + "/drive.google.com" + window.location.pathname + window.location.search + window.location.hash; }</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Classroom</title>
    <link rel="icon" href="https://www.gstatic.com/images/branding/product/1x/classroom_48dp.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading {
            color: #eaeaea;
            text-align: center;
            font-size: 1.5em;
        }

        .spinner {
            border: 4px solid rgba(233, 69, 96, 0.3);
            border-top: 4px solid #e94560;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .error {
            color: #eaeaea;
            padding: 20px;
            text-align: center;
        }

        .error h2 {
            color: #e94560;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="game-container" id="container">
        <div class="loading">
            <div>Loading game...</div>
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        // Add Ctrl+K keyboard shortcut for Google Classroom
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                e.stopPropagation();
                window.open('https://classroom.google.com', '_blank');
            }
        }, true);

        // Get game file path from URL
        const params = new URLSearchParams(window.location.search);
        const gameUrl = params.get('gameUrl');

        if (!gameUrl) {
            document.getElementById('container').innerHTML = `
                <div class="error">
                    <h2>Error</h2>
                    <p>No game specified</p>
                </div>
            `;
        } else {
            // Load game directly from file path
            const gameFrame = document.createElement('iframe');
            gameFrame.src = decodeURIComponent(gameUrl);
            gameFrame.sandbox = 'allow-scripts allow-same-origin allow-popups allow-forms allow-presentation allow-modals';
            document.getElementById('container').innerHTML = '';
            document.getElementById('container').appendChild(gameFrame);
        }
    </script>
    <!-- PANIC BUTTON REDIRECT -->
    <script>
        document.addEventListener('keydown', function(e) {
            if (e.key === '-') {
                window.location.replace('https://classroom.google.com');
            }
        }, true);

        if (!localStorage.getItem('panicButtonNotificationShown')) {
            localStorage.setItem('panicButtonNotificationShown', 'true');

            var panicNotification = document.createElement('div');
            panicNotification.style.cssText = 'position: fixed; bottom: 20px; left: 20px; right: 20px; max-width: 420px; margin: auto; background: rgba(16, 18, 30, 0.96); color: #f4f4f4; border: 1px solid rgba(233, 69, 96, 0.85); border-radius: 16px; padding: 16px 18px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; font-size: 0.95rem; line-height: 1.5; box-shadow: 0 18px 35px rgba(0, 0, 0, 0.22); z-index: 999999;';
            panicNotification.innerHTML = '<div style="display:flex; flex-direction:column; gap:12px;"><div><strong style="font-size:1rem; display:block; margin-bottom:6px;">Panic Button Tip</strong><span>Press <kbd style="background:#222;color:#fff;border-radius:5px;padding:4px 7px;font-size:0.95rem;">-</kbd> to jump to Google Classroom. This tip will only appear once.</span></div></div>';
            var closeButton = document.createElement('button');
            closeButton.textContent = 'Got it';
            closeButton.style.cssText = 'display:block; margin-top:14px; padding: 8px 14px; background:#e94560; color:white; border:none; border-radius:10px; cursor:pointer; font-weight:600;';
            closeButton.onclick = function() { panicNotification.remove(); };
            panicNotification.appendChild(closeButton);
            document.body.appendChild(panicNotification);
        }
    </script>

</body>
</html>
